# grepom 内置 gitleaks 误报放行层 —— 叠加在官方默认规则之上
# 本文件只定义放行(allowlists),不含规则;默认规则集由 loadConfig 经
# detect.NewDetectorDefaultConfig 提供(不走 [extend]:gitleaks 的 extendDepth
# 是包级只增变量,同进程多次 Translate 会静默丢规则)。
#
# 维护约定(忽略力度,从严到宽,改前先读):
#   1) 模式级放行仅限"语义上不可能是秘密":公钥/完整性指纹/自明占位符/代码惯用法;
#   2) 其余一律按完整值逐一放行(等值匹配,不做前缀通配),注释写日期+原因;
#   3) 路径级豁免只给"逐值枚举不完"的场景(如扫描器自身测试夹具);
#   4) 真实凭据永不进本文件 —— 先轮换处置,再谈忽略。
# 全量重扫 grepom scan 验证;回归样本见 allowlist_test.go。

[extend]
useDefault = true

# ---- 模式级:语义上不可能是秘密 ----
[[allowlists]]
description = "RSA 公钥(X.509 SubjectPublicKeyInfo)与自明示例/占位 token"
regexTarget = "match"
regexes = [
  # RSA 公钥 DER 序列头(1024/2048);私钥体不会以这两段开头
  'MIGfMA0GCSqGSIb3DQEB',
  'MIIBIjANBgkqhkiG9w0BAQEF',
  # 纯顺序数字占位(文档示例,如 sk-1234567890abcdef)
  'sk-1234567890(abcdef)?',
  # 自明的测试假 key(测试夹具惯用)
  'sk-(test|integration)[a-z0-9-]*',
  # PEM/DER 格式名字面量被误当值(如 node-rsa 的 'pkcs8-private-pem')
  'pkcs[18]-(pem|der|private|public)',
]

# ---- 行上下文级:值本身是哈希/指纹/代码 ----
[[allowlists]]
description = "完整性指纹行(sha256 摘要、fingerprint/checksum/digest JSON 字段)"
regexTarget = "line"
regexes = [
  '(?i)"(sha256|fingerprint|checksum|digest)[a-zA-Z_]*"\s*:',
  '(?i)\bsha256:?[0-9a-f]{16,}\b',
  # jsencrypt 库源码内构造 PEM 的模板字符串(非真实密钥)
  'var key = "-----BEGIN RSA PRIVATE KEY',
  # README/curl 文档里的示例读写 token(write123 等)
  '(?i)authorization:\s*bearer\s+(read|write)(123|456)\b',
]

[[allowlists]]
description = "代码惯用法(MATLAB jsonlab 取值语句 val=struct.key)"
regexTarget = "line"
regexes = [
  'val\s*=\s*[A-Za-z_][\w.]*\.key\b',
]

# ---- 路径级:逐值枚举不完的测试夹具 ----
[[allowlists]]
description = "ui-templates-skill 发制证据指纹(机器生成的 sha256;路径与 64-hex 行同时命中才放行)"
condition = "AND"
regexTarget = "line"
regexes = [
  '"[A-Za-z0-9_-]+":\\s*"[0-9a-f]{64}"',
]
paths = [
  '(^|/)governance/',
  '(^|/)openspec/',
]

[[allowlists]]
description = "grepom 自身扫描器测试夹具(人为构造的假私钥/假值)"
paths = [
  '(^|/)scanner/scanner_test\.go$',
]

# ---- 值级:逐一确认无害的具体值 ----
